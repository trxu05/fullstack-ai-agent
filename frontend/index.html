<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Agent Workbench</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>AI Agent Workbench</h1>
      <p>Java API gateway · Python tool-calling agent · JavaScript UI</p>
    </header>
    <section id="log" class="log" aria-live="polite"></section>
    <form id="chat-form">
      <input id="message" type="text" placeholder="Try: calculate 12 * (3 + 4)" autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
