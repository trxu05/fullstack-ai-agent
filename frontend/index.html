<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>News Digest Agent</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>News Digest Agent</h1>
      <p>Tell it a topic → it collects public headlines → returns an AI/extractive recap.</p>
      <p class="hint">Try: <code>digest AI chips</code> · <code>watch topic cloud networking</code> · <code>digest</code></p>
    </header>
    <section id="log" class="log" aria-live="polite"></section>
    <form id="chat-form">
      <input id="message" type="text" placeholder="digest semiconductor and AI infrastructure" autocomplete="off" required />
      <button type="submit">Run</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
